info:
  name: get-market-data-status
  type: http
  seq: 35

http:
  method: GET
  url: "{{investment-base-url}}/funds/:fundId/market-data/status"
  params:
    - name: fundId
      value: "{{investment-fund-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
