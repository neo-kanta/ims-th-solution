info:
  name: list-alerts
  type: http
  seq: 1

http:
  method: GET
  url: "{{watchlist-base-url}}/alerts"
  params:
    - name: scope_type
      value: "{{watchlist-scope-type}}"
      type: query
    - name: portfolio_id
      value: "{{investment-portfolio-id}}"
      type: query
    - name: security_id
      value: "{{reference-data-security-id}}"
      type: query
    - name: rule_id
      value: "{{watchlist-rule-id}}"
      type: query
    - name: acknowledged
      value: "{{watchlist-acknowledged}}"
      type: query
    - name: created_from
      value: "{{watchlist-created-from}}"
      type: query
    - name: created_to
      value: "{{watchlist-created-to}}"
      type: query
    - name: limit
      value: "{{watchlist-limit}}"
      type: query
    - name: offset
      value: "{{watchlist-offset}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const payload = body?.data || {};
        const rows = Array.isArray(payload) ? payload : Array.isArray(payload.items) ? payload.items : [];
        const first = rows[0] || {};

        if (first.id) {
          bru.setEnvVar("watchlist-alert-id", first.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
