name: Deploy Backend to Oracle

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "database/**"
      - "infra/docker/Dockerfile.backend"
      - ".github/workflows/deploy-backend-oracle.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-oracle
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ims-th-backend

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Build backend
        working-directory: backend
        run: go build ./cmd/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: test-build-push

    steps:
      - name: Deploy on Oracle host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            CONTAINER_NAME="${{ secrets.ORACLE_BACKEND_CONTAINER_NAME }}"
            ENV_FILE="${{ secrets.ORACLE_BACKEND_ENV_FILE }}"
            HOST_PORT="${{ secrets.ORACLE_BACKEND_HOST_PORT }}"
            DOCKER_NETWORK="${{ secrets.ORACLE_DOCKER_NETWORK }}"
            GHCR_USER="${{ secrets.GHCR_DEPLOY_USERNAME }}"
            GHCR_TOKEN="${{ secrets.GHCR_DEPLOY_TOKEN }}"
            DOCKER="sudo docker"

            if ! sudo docker info >/dev/null 2>&1; then
              echo "Docker is not accessible for the SSH user on the Oracle host."
              echo "Make sure Docker is installed and that the user can run sudo docker commands."
              exit 1
            fi

            echo "$GHCR_TOKEN" | $DOCKER login ghcr.io -u "$GHCR_USER" --password-stdin
            $DOCKER pull "$IMAGE"

            $DOCKER network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || $DOCKER network create "$DOCKER_NETWORK"

            $DOCKER rm -f "${CONTAINER_NAME}-new" >/dev/null 2>&1 || true

            $DOCKER run -d \
              --name "${CONTAINER_NAME}-new" \
              --network "$DOCKER_NETWORK" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -p "$HOST_PORT:8080" \
              "$IMAGE"

            sleep 10
            $DOCKER ps
            $DOCKER logs --tail 100 "${CONTAINER_NAME}-new"

            curl -fsS "http://127.0.0.1:${HOST_PORT}/api/v1/swagger/index.html" >/dev/null

            $DOCKER rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            $DOCKER rename "${CONTAINER_NAME}-new" "$CONTAINER_NAME"

            $DOCKER image prune -f
