info:
  name: list-asset-subtypes
  type: http
  seq: 2

http:
  method: GET
  url: "{{investment-base-url}}/reference/asset-subtypes?asset_class_id"
  params:
    - name: asset_class_id
      value: "{{investment-asset-class-id}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || [];
        const first = Array.isArray(data) ? data[0] : {};
        const id = first?.id || first?.ID;

        if (id) {
          bru.setEnvVar("investment-asset-subtype-id", id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

