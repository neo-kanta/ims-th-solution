info:
  name: list-watchlist
  type: http
  seq: 10

http:
  method: GET
  url: "{{market-data-base-url}}/screen/watchlist?limit={{market-data-history-limit}}"
  params:
    - name: limit
      value: "{{market-data-history-limit}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
