info:
  name: get-fund
  type: http
  seq: 10

http:
  method: GET
  url: "{{investment-base-url}}/funds/:fundId"
  params:
    - name: fundId
      value: "{{investment-fund-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || {};

        if (data.version !== undefined) {
          bru.setEnvVar("investment-fund-version", String(data.version), { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

