info:
  name: get-process
  type: http
  seq: 3

http:
  method: GET
  url: "{{approval-config-base-url}}/processes/:processId"
  params:
    - name: processId
      value: "{{approval-process-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || {};

        if (data.id) {
          bru.setEnvVar("approval-process-id", data.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
