info:
  name: list-decision-approval-items
  type: http
  seq: 3

http:
  method: GET
  url: "{{investment-base-url}}/decisions/approval-items"
  params:
    - name: page
      value: "{{investment-page}}"
      type: query
    - name: limit
      value: "{{investment-limit}}"
      type: query
    - name: portfolio_id
      value: "{{investment-portfolio-id}}"
      type: query
    - name: fund_id
      value: "{{investment-fund-id}}"
      type: query
    - name: business_date_from
      value: "{{investment-from-date}}"
      type: query
    - name: business_date_to
      value: "{{investment-to-date}}"
      type: query
    - name: decision_no
      value: "{{investment-decision-no}}"
      type: query
    - name: process_type
      value: "{{investment-decision-process-type}}"
      type: query
    - name: product_type
      value: "{{investment-decision-product-type}}"
      type: query
    - name: research_no
      value: "{{investment-decision-research-no}}"
      type: query
    - name: status
      value: "{{investment-decision-approval-status}}"
      type: query
    - name: search
      value: "{{investment-decision-search}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const payload = body?.data || {};
        const rows = Array.isArray(payload) ? payload : Array.isArray(payload.items) ? payload.items : [];
        const first = rows[0] || {};

        if (first.id) {
          bru.setEnvVar("investment-decision-id", first.id, { persist: true });
        }
        if (first.decision_no) {
          bru.setEnvVar("investment-decision-no", first.decision_no, { persist: true });
        }
        if (first.decision_number) {
          bru.setEnvVar("investment-decision-no", first.decision_number, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
