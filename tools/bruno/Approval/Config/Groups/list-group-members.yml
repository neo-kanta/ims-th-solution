info:
  name: list-group-members
  type: http
  seq: 3

http:
  method: GET
  url: "{{approval-config-base-url}}/groups/:groupId/members"
  params:
    - name: groupId
      value: "{{approval-group-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const rows = Array.isArray(body?.data) ? body.data : [];
        const first = rows[0] || {};

        if (first.id) {
          bru.setEnvVar("approval-group-member-id", first.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
