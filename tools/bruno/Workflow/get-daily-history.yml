info:
  name: get-daily-history
  type: http
  seq: 7

http:
  method: GET
  url: "{{base-url}}workflow/daily/transitions?businessDate={{workflow-business-date}}&page=1&pageSize=20"
  params:
    - name: businessDate
      value: "{{workflow-business-date}}"
      type: query
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
