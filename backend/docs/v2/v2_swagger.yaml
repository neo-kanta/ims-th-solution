      compliance_release_approval_request_id:
        type: string
      created_at:
        type: string
      currency:
        type: string
      current_approvers:
        items:
          type: string
        type: array
      decision_number:
        type: string
      decision_type:
        type: string
      exchange:
        type: string
      fund_id:
        type: string
      id:
        type: string
      instrument_code:
        type: string
      instrument_id:
        type: string
      limit_price:
        type: string
      lines:
