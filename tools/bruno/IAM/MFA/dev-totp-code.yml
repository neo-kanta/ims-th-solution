info:
  name: dev-totp-code
  type: http
  seq: 5

http:
  method: GET
  url: "{{iam-mfa}}/dev/totp-code"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || {};

        if (data.totp_code) {
          bru.setEnvVar("totp_code", data.totp_code, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
