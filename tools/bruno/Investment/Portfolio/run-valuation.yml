info:
  name: run-valuation
  type: http
  seq: 25

http:
  method: POST
  url: "{{investment-base-url}}/portfolios/:portfolioId/valuations"
  params:
    - name: portfolioId
      value: "{{investment-portfolio-id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "business_date": "{{investment-business-date}}",
        "fx_rates": {{investment-fx-rates}},
        "total_units": "{{investment-total-units}}"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || {};

        if (data.id) {
          bru.setEnvVar("investment-valuation-id", data.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
