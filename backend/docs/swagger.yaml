basePath: /api/v1
definitions:
  AUMResponse:
    properties:
      aum:
        type: string
      business_date:
        type: string
      created_at:
        type: string
      id:
        type: string
      scope_id:
        type: string
      scope_type:
        type: string
      source:
        type: string
      valuation_ccy:
        type: string
    type: object
  AcknowledgeAlertRequest:
    properties:
      note:
        type: string
    type: object
  ActionRequest:
    properties:
      comment:
        type: string
      reason:
        type: string
    type: object
  AddProviderMappingRequest:
    properties:
      confidence_score:
        type: string
      is_primary:
        type: boolean
      priority:
        type: integer
      provider_asset_type:
        type: string
      provider_code:
        type: string
      provider_currency:
        type: string
      provider_exchange:
        type: string
      provider_symbol:
        type: string
    type: object
  AdminResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
    required:
    - new_password
    type: object
  AdminUserListResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/AdminUserResponse'
        type: array
    type: object
  AdminUserResponse:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      failed_login_attempts:
        type: integer
      force_password_change:
        type: boolean
      groups:
        items:
          type: string
        type: array
      id:
        type: string
      is_active:
        type: boolean
      is_locked:
        type: boolean
      last_login_at:
        type: string
      locked_until:
        type: string
      password_changed_at:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  AlertEventResponse:
    properties:
      acknowledged_at:
        type: string
      acknowledged_by:
        type: string
      acknowledged_by_user:
        $ref: '#/definitions/UserDescriptor'
      acknowledgement_note:
        type: string
      acknowledgement_state:
        type: string
      created_at:
        type: string
      created_by_user:
        $ref: '#/definitions/UserDescriptor'
      created_by_user_id:
        type: string
      currency:
        type: string
      current_state:
        type: string
      direction:
        type: string
      evaluated_at:
        type: string
      id:
        type: string
      notification_status:
        type: string
      observed_at:
        type: string
      observed_price:
        type: string
      owner_user_id:
        type: string
      portfolio:
        $ref: '#/definitions/PortfolioDescriptor'
      portfolio_id:
        type: string
      previous_state:
        type: string
      quote_provider:
        type: string
      scope_type:
        type: string
      security:
        $ref: '#/definitions/SecurityDescriptor'
      stale:
        type: boolean
      stale_reason:
        type: string
      threshold_rule_id:
        type: string
      threshold_value:
        type: string
      watchlist_item_id:
        type: string
    type: object
  AllocationBucketResponse:
    properties:
      key:
        description: stable machine key
        type: string
      label:
        description: human label
        type: string
      market_value:
        description: decimal string in valuation_ccy
        type: string
      pct_of_nav:
        description: 0..100, two-decimal precision
        type: string
    type: object
  ApproverInput:
    properties:
      accountCode:
        description: AccountCode is the approver's account code. Required.
        type: string
      role:
        description: Role is a descriptive label (e.g. "FundManager"). Optional.
        type: string
      username:
        description: Username is a snapshot of the approver's display name. Optional.
        type: string
    type: object
  AssetClass:
    properties:
      code:
        type: string
      createdAt:
        type: string
      description:
        type: string
      displayOrder:
        type: integer
      id:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      updatedAt:
        type: string
    type: object
  AssetSubtype:
    properties:
      assetClassID:
        type: string
      code:
        type: string
      createdAt:
        type: string
      description:
        type: string
      displayOrder:
        type: integer
      id:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      updatedAt:
        type: string
    type: object
  AssetType:
    enum:
    - UNKNOWN
    - EQUITY
    - ETF
    - MUTUAL_FUND
    type: string
    x-enum-varnames:
    - AssetTypeUnknown
    - AssetTypeEquity
    - AssetTypeETF
    - AssetTypeMutualFund
  AuditEventResponse:
    properties:
      actor_id:
        type: string
      created_at:
        type: string
      event_type:
        type: string
      id:
        type: string
      ip_address:
        type: string
      metadata:
        additionalProperties: true
        type: object
      target_id:
        type: string
      target_type:
        type: string
      user_agent:
        type: string
    type: object
  AuditListResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/AuditEventResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  BatchApprovalRequest:
    properties:
      comment:
        type: string
      decision_nos:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - decision_nos
    type: object
  BatchApprovalResponse:
    properties:
      failed:
        type: integer
      results:
        items:
          $ref: '#/definitions/BatchApprovalResultResponse'
        type: array
      succeeded:
        type: integer
    type: object
  BatchApprovalResultResponse:
    properties:
      decision_no:
        type: string
      error:
        type: string
      ok:
        type: boolean
    type: object
  BatchRejectionRequest:
    properties:
      decision_nos:
        items:
          type: string
        minItems: 1
        type: array
      reason:
        maxLength: 500
        type: string
    required:
    - decision_nos
    - reason
    type: object
  BlockingReason:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  Breach:
    properties:
      businessDate:
        type: string
      checkGroupID:
        type: string
      checkRecordID:
        type: string
      contractID:
        description: nil for portfolio-only checks (no fund_id)
        type: string
      createdAt:
        type: string
      evidence:
        type: object
      id:
        type: string
      message:
        type: string
      portfolioID:
        type: string
      resolvedAt:
        type: string
      resolvedBy:
        type: string
      ruleInstanceID:
        type: string
      ruleTypeID:
        type: string
      severity:
        type: string
      status:
        type: string
      verdict:
        type: string
    type: object
  BreachSummary:
    properties:
      breach_id:
        type: string
      message:
        type: string
      overridable:
        type: boolean
      rule_type_id:
        type: string
      severity:
        type: string
      verdict:
        type: string
    type: object
  CancelDecisionRequest:
    properties:
      reason:
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  CandidatesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/UnmappedCandidateDTO'
        type: array
    type: object
  CashBalanceResponse:
    properties:
      balance:
        type: string
      currency:
        type: string
      last_business_date:
        type: string
      version:
        type: integer
    type: object
  CashProjectionResponse:
    properties:
      cash_impact:
        type: string
      currency:
        type: string
      current_balance:
        type: string
      projected_balance:
        type: string
    type: object
  ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  ChatFigureBinding:
    properties:
      figure:
        example: "10.25"
        type: string
      source:
        example: tool_raw
        type: string
      tool_name:
        example: get_fund_nav
        type: string
    type: object
  ChatMessageResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      provenance:
        type: object
      role:
        example: assistant
        type: string
    type: object
  ChatSourceRef:
    properties:
      as_of:
        example: "2026-06-07T08:30:00Z"
        type: string
      server:
        example: ims
        type: string
      state:
        example: succeeded
        type: string
      tool_name:
        example: get_fund_nav
        type: string
    type: object
  ChatStreamEvent:
    properties:
      bindings:
        description: |-
          Bindings links cited figures to the tool that produced them. Present only
          on kind=sources, and only when the answer passed numeric validation.
        items:
          $ref: '#/definitions/ChatFigureBinding'
        type: array
      error:
        description: Error is a safe, user-facing error message. Present only on kind=error.
        example: the assistant could not complete this turn
        type: string
      kind:
        description: 'Kind is the SSE event name. One of: session_started, text, done,
          error.'
        example: text
        type: string
      message_id:
        description: |-
          MessageID is the user message id on session_started, or the assistant
          message id on done.
        example: 123e4567-e89b-12d3-a456-426614174001
        type: string
      session_id:
        description: SessionID is the conversation id. Present on session_started,
          done, and error.
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      sources:
        description: |-
          Sources lists the turn-level provenance (which tools ran). Present only on
          kind=sources.
        items:
          $ref: '#/definitions/ChatSourceRef'
        type: array
      stop_reason:
        description: |-
          StopReason is the canonical termination reason. Present only on kind=done.
          One of: end_turn, tool_use, max_tokens, stop_sequence, error, unknown.
        example: end_turn
        type: string
      text:
        description: Text is an incremental token. Present only on kind=text.
        example: Hello
        type: string
      tool_name:
        description: ToolName is the MCP tool being called. Present only on kind=tool_call.
        example: get_portfolio_holdings
        type: string
      tool_status:
        description: |-
          ToolStatus is the tool-call lifecycle marker. Present only on
          kind=tool_call. One of: running, ok, error, denied.
        example: running
        type: string
      unverified:
        description: |-
          Unverified lists the figures that failed numeric validation. Present only
          on kind=validation with tool_status=blocked.
        items:
          type: string
        type: array
    type: object
  CheckGroupResult:
    properties:
      breaches:
        items:
          $ref: '#/definitions/Breach'
        type: array
      check_group_id:
        type: string
      records:
        items:
          $ref: '#/definitions/CheckRecord'
        type: array
    type: object
  CheckRecord:
    properties:
      businessDate:
        type: string
      checkGroupID:
        description: groups all records from a single check request
        type: string
      checkedAt:
        type: string
      checkedBy:
        description: actor ID or "system"
        type: string
      contractID:
        description: nil for portfolio-only checks (no fund_id)
        type: string
      createdAt:
        type: string
      dataSnapshotHash:
        description: SHA-256 of the DataBundle used
        type: string
      effectiveSeverity:
        description: binding-level severity applied
        type: string
      evalDurationMs:
        format: int64
        type: integer
      evidence:
        description: structured evidence
        type: object
      finalVerdict:
        description: after severity cap
        type: string
      id:
        type: string
      message:
        type: string
      orderID:
        description: nil for periodic checks
        type: string
      parameterSnapshot:
        description: frozen copy of params used
        type: object
      portfolioID:
        type: string
      ruleInstanceID:
        type: string
      ruleInstanceVersion:
        type: integer
      ruleTypeID:
        type: string
      ticker:
        description: empty for portfolio-wide periodic checks
        type: string
      timing:
        type: string
      verdict:
        description: raw verdict from rule
        type: string
    type: object
  ComplianceBreachPreviewResponse:
    properties:
      breach_id:
        type: string
      message:
        type: string
      overridable:
        type: boolean
      rule_type_id:
        type: string
      severity:
        type: string
      verdict:
        type: string
    type: object
  CompliancePreviewResponse:
    properties:
      breaches:
        items:
          $ref: '#/definitions/ComplianceBreachPreviewResponse'
        type: array
      check_group_id:
        type: string
      rules_evaluated:
        type: integer
      verdict:
        type: string
    type: object
  ComputeFundAUMRequest:
    properties:
      business_date:
        type: string
    required:
    - business_date
    type: object
  ComputeFundAUMResponse:
    properties:
      idempotent:
        type: boolean
      portfolio_count:
        type: integer
      snapshot:
        $ref: '#/definitions/AUMResponse'
    type: object
  Country:
    properties:
      createdAt:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      isocode:
        type: string
      name:
        type: string
      regionID:
        type: string
      updatedAt:
        type: string
    type: object
  CreateDecisionRequest:
    properties:
      amount:
        type: string
      business_date:
        type: string
      currency:
        type: string
      exchange:
        type: string
      fund_id:
        type: string
      instrument_code:
        maxLength: 40
        type: string
      instrument_id:
        type: string
      limit_price:
        type: string
      portfolio_id:
        type: string
      quantity:
        type: string
      rationale:
        type: string
      research_report_id:
        type: string
      side:
        enum:
        - BUY
        - SELL
        type: string
    required:
    - business_date
    - currency
    - fund_id
    - instrument_code
    - portfolio_id
    - side
    type: object
  CreateExecutionRequest:
    properties:
      broker_reference:
        type: string
      decision_id:
        type: string
      ordered_amount:
        type: string
      ordered_quantity:
        type: string
    required:
    - decision_id
    type: object
  CreateFundRequest:
    properties:
      base_currency:
        type: string
      benchmark:
        type: string
      code:
        maxLength: 40
        type: string
      external_pam_ref:
        type: string
      fund_category_id:
        type: string
      has_units:
        type: boolean
      inception_date:
        type: string
      manager_user_id:
        type: string
      name:
        maxLength: 255
        type: string
      require_pretrade_preview:
        description: |-
          RequirePretradePreview controls the trade-ticket UX on the Operation tab.
          When true the UI must run a pre-trade simulation before allowing a post;
          when false it posts directly (server still enforces gates).
        type: boolean
      risk_profile:
        type: string
      short_name:
        maxLength: 80
        type: string
    required:
    - base_currency
    - code
    - fund_category_id
    - inception_date
    - name
    type: object
  CreateImportBatchRequest:
    properties:
      chunk_size:
        type: integer
      history_limit:
        type: integer
      idempotency_key:
        type: string
      import_type:
        type: string
      include_history:
        type: boolean
      include_quote:
        type: boolean
      provider:
        type: string
      symbols:
        items:
          type: string
        type: array
    type: object
  CreateImportBatchResponse:
    properties:
      batch_id:
        type: string
      reused:
        type: boolean
      status:
        type: string
      total_chunks:
        type: integer
      total_symbols:
        type: integer
    type: object
  CreateInstrumentRequest:
    properties:
      asset_class_id:
        type: string
      asset_subtype_id:
        type: string
      attributes:
        additionalProperties: {}
        type: object
      country_id:
        type: string
      currency:
        type: string
      fund_category_id:
        type: string
      lot_size:
        type: integer
      name:
        maxLength: 255
        type: string
      primary_exchange:
        type: string
      primary_ticker:
        maxLength: 40
        type: string
      region_id:
        type: string
      sector_id:
        type: string
      tick_size:
        type: string
    required:
    - asset_class_id
    - asset_subtype_id
    - country_id
    - currency
    - name
    - primary_ticker
    type: object
  CreateItemRequest:
    properties:
      note:
        type: string
      pinned:
        type: boolean
      portfolio_id:
        type: string
      scope_type:
        type: string
      security_id:
        type: string
      threshold_rules:
        items:
          $ref: '#/definitions/ThresholdRuleRequest'
        type: array
    type: object
  CreatePortfolioRequest:
    properties:
      base_currency:
        type: string
      benchmark:
        type: string
      code:
        maxLength: 40
        type: string
      description:
        type: string
      fund_id:
        type: string
      has_units:
        type: boolean
      inception_date:
        type: string
      manager_user_id:
        type: string
      name:
        maxLength: 255
        type: string
      portfolio_type:
        type: string
      risk_profile:
        type: string
      strategy_code:
        type: string
      style_id:
        type: string
      tax_lot_method:
        type: string
      valuation_currency:
        type: string
    required:
    - base_currency
    - code
    - fund_id
    - inception_date
    - name
    - valuation_currency
    type: object
  CreateResearchReportRequest:
    properties:
      applicable_contract_id:
        type: string
      author_user_id:
        type: string
      company_outlook:
        type: string
      company_overview:
        type: string
      currency:
        type: string
      effective_date:
        type: string
      esg_comment:
        type: string
      financial_status:
        type: string
      instrument_code:
        maxLength: 40
        type: string
      instrument_name:
        type: string
      instrument_type:
        type: string
      investment_analysis:
        minLength: 25
        type: string
      market:
        type: string
      owner_user_id:
        type: string
      recommendation:
        enum:
        - BUY
        - SELL
        - HOLD
        type: string
      report_date:
        type: string
      report_no:
        maxLength: 60
        type: string
      report_title:
        type: string
    required:
    - author_user_id
    - instrument_code
    - investment_analysis
    - owner_user_id
    - recommendation
    - report_date
    - report_no
    type: object
  CreateRuleInstanceRequest:
    properties:
      change_reason:
        description: '"initial creation" if blank'
        type: string
      description:
        type: string
      effective_from:
        description: '"2006-01-02"'
        type: string
      effective_to:
        description: '"2006-01-02" or null'
        type: string
      is_active:
        description: defaults to true
        type: boolean
      name:
        type: string
      parameters:
        type: object
      rule_type_id:
        type: string
    type: object
  CreateRuleInstanceResult:
    properties:
      instance:
        $ref: '#/definitions/RuleInstance'
      version:
        $ref: '#/definitions/RuleInstanceVersion'
    type: object
  CreateSecurityRequest:
    properties:
      asset_type:
        type: string
      auto_build_ims_symbol:
        type: boolean
      country_code:
        type: string
      currency:
        type: string
      cusip:
        type: string
      display_symbol:
        type: string
      exchange_mic:
        type: string
      figi:
        type: string
      ims_symbol:
        type: string
      isin:
        type: string
      name:
        type: string
      primary_identifier:
        type: string
      status:
        type: string
    type: object
  CreateUserRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        minLength: 3
        type: string
    required:
    - display_name
    - email
    - password
    - username
    type: object
  DailyApproverEntry:
    properties:
      accountCode:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  DailyAuditSummary:
    properties:
      lastTransitionAt:
        type: string
      lastTransitionBy:
        type: string
      totalTransitions:
        type: integer
    type: object
  DailyBlockingReason:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  DailyExecuteRequest:
    properties:
      accountingDate:
        description: |-
          AccountingDate applies to CLOSE_ACCOUNTING. Format YYYY-MM-DD.
          When omitted, defaults to BusinessDate.
        type: string
      attestationReason:
        description: AttestationReason is required when ZeroTransactionAttestation
          is true (min 30 chars).
        type: string
      businessDate:
        description: BusinessDate is mandatory; format YYYY-MM-DD (Asia/Bangkok calendar).
        type: string
      notes:
        description: Notes is an optional free-text remark for MANAGER_APPROVE.
        type: string
      operationType:
        description: |-
          OperationType is the canonical API operation name.
          Valid values: START_INVESTMENT_DAY, CANCEL_INVESTMENT_DAY,
            MANAGER_APPROVE, CANCEL_MANAGER_APPROVAL,
            CLOSE_TRANSACTION, CANCEL_TRANSACTION_CLOSE,
            CLOSE_ACCOUNTING, CANCEL_ACCOUNTING_CLOSE
        type: string
      reason:
        description: Reason is mandatory for cancel/rollback operations (min 20 chars).
        type: string
      remark:
        description: |-
          Remark is optional free text from the operator. For cancel/rollback
          operations it is accepted as an alias for reason.
        type: string
      zeroTransactionAttestation:
        description: |-
          ZeroTransactionAttestation must be true when approving a day with no
          investment transactions. Applies to MANAGER_APPROVE only.
        type: boolean
    type: object
  DailyModuleStatus:
    properties:
      ready:
        type: boolean
      reason:
        type: string
    type: object
  DailyOperationSetting:
    properties:
      approvalMode:
        type: string
      approvers:
        items:
          $ref: '#/definitions/DailyApproverEntry'
        type: array
    type: object
  DailySettingsUpdateRequest:
    properties:
      approvers:
        description: |-
          Approvers replaces the entire active approver list for this operation type.
          Pass an empty array to remove all approvers.
        items:
          $ref: '#/definitions/ApproverInput'
        type: array
      operationType:
        description: OperationType is the operation type to configure approvers for.
        type: string
    type: object
  DailyTimelineEntry:
    properties:
      executedAt:
        type: string
      executedByAccountCode:
        type: string
      executedByUsername:
        type: string
      fromState:
        type: string
      isAdminOverride:
        type: boolean
      operationType:
        description: canonical API name
        type: string
      reason:
        type: string
      toState:
        type: string
      transitionId:
        type: string
    type: object
  DailyTransitionsResponse:
    properties:
      businessDate:
        type: string
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      transitions:
        items:
          $ref: '#/definitions/DailyTimelineEntry'
        type: array
    type: object
  DailyWorkflowResponse:
    description: Aggregated workflow state for one contract on one business date.
    properties:
      allowedOperations:
        description: AllowedOperations lists operation types the caller may attempt
          (API names).
        items:
          type: string
        type: array
      approvers:
        additionalProperties:
          items:
