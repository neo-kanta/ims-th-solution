info:
  name: reverse-transaction
  type: http
  seq: 24

http:
  method: POST
  url: "{{investment-base-url}}/portfolios/:portfolioId/transactions/:transactionId/reverse"
  params:
    - name: portfolioId
      value: "{{investment-portfolio-id}}"
      type: path
    - name: transactionId
      value: "{{investment-transaction-id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "business_date": "{{investment-business-date}}",
        "reason": "{{investment-reversal-reason}}",
        "force_post": {{investment-force-post}}
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || {};

        if (data.id) {
          bru.setEnvVar("investment-reversal-transaction-id", data.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
