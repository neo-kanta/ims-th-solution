info:
  name: reset-password
  type: http
  seq: 10

http:
  method: POST
  url: "{{iam-admin}}/users/:id/reset-password"
  params:
    - name: id
      value: "{{user_id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "new_password": "reset1234"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
