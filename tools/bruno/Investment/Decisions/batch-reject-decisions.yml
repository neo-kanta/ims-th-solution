info:
  name: batch-reject-decisions
  type: http
  seq: 8

http:
  method: POST
  url: "{{investment-base-url}}/decisions/batch-reject"
  body:
    type: json
    data: |-
      {
        "decision_nos": [
          "{{investment-decision-no}}"
        ],
        "reason": "{{investment-decision-reject-reason}}"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
