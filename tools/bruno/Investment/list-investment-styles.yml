info:
  name: list-investment-styles
  type: http
  seq: 7

http:
  method: GET
  url: "{{investment-base-url}}/reference/investment-styles"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || [];
        const first = Array.isArray(data) ? data[0] : {};
        const id = first?.id || first?.ID;

        if (id) {
          bru.setEnvVar("investment-style-id", id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

