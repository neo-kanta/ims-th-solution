info:
  name: get-request
  type: http
  seq: 4

http:
  method: GET
  url: "{{approval-base-url}}/requests/:requestId"
  params:
    - name: requestId
      value: "{{approval-request-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
