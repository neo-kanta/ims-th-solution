info:
  name: revoke-group-member
  type: http
  seq: 9

http:
  method: POST
  url: "{{approval-config-base-url}}/groups/:groupId/members/:memberId/revoke"
  params:
    - name: groupId
      value: "{{approval-group-id}}"
      type: path
    - name: memberId
      value: "{{approval-group-member-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
