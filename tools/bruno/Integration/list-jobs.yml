info:
  name: list-jobs
  type: http
  seq: 1

http:
  method: GET
  url: "{{integration-etl}}/jobs?type&date&status&page&limit"
  params:
    - name: type
      value: ""
      type: query
    - name: date
      value: ""
      type: query
    - name: status
      value: ""
      type: query
    - name: page
      value: "0"
      type: query
    - name: limit
      value: "50"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || {};

        if (data.jobs?.[0]?.id) {
          bru.setEnvVar("etl_job_id", data.jobs[0].id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
