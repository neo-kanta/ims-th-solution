      details: {}
      error:
        type: string
    type: object
  ExecutionListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/ExecutionResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  ExecutionResponse:
