info:
  name: get-security
  type: http
  seq: 3

http:
  method: GET
  url: "{{reference-data-base-url}}/securities/:securityId"
  params:
    - name: securityId
      value: "{{reference-data-security-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
