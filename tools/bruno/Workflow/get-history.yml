info:
  name: get-history
  type: http
  seq: 2

http:
  method: GET
  url: "{{workflow-base-url}}/:contractId/history?businessDate={{workflow-business-date}}"
  params:
    - name: businessDate
      value: "{{workflow-business-date}}"
      type: query
    - name: contractId
      value: "{{workflow-contract-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
