info:
  name: list-instruments
  type: http
  seq: 18

http:
  method: GET
  url: "{{investment-base-url}}/instruments"
  params:
    - name: asset_class_id
      value: "{{investment-asset-class-id}}"
      type: query
    - name: search
      value: "{{investment-instrument-ticker}}"
      type: query
    - name: page
      value: "{{investment-page}}"
      type: query
    - name: limit
      value: "{{investment-limit}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const item = body?.data?.items?.[0] || {};

        if (item.id) {
          bru.setEnvVar("investment-instrument-id", item.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
