info:
  name: get-subject-status
  type: http
  seq: 8

http:
  method: GET
  url: "{{approval-base-url}}/subjects/:subjectType/:subjectId/status"
  params:
    - name: subjectType
      value: RESEARCH_REPORT
      type: path
    - name: subjectId
      value: "{{investment-research-report-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
