info:
  name: revoke-session
  type: http
  seq: 5

http:
  method: POST
  url: "{{iam-admin}}/sessions/:id/revoke"
  params:
    - name: id
      value: "{{session_id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
