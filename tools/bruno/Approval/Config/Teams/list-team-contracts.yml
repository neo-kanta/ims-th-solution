info:
  name: list-team-contracts
  type: http
  seq: 4

http:
  method: GET
  url: "{{approval-config-base-url}}/teams/:teamId/contracts"
  params:
    - name: teamId
      value: "{{approval-team-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
