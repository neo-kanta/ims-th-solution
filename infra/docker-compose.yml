name: ims-th-solution

services:
  postgres:
    image: postgres:16-alpine
    container_name: ims-postgres
    restart: unless-stopped
    ports:
      - "5437:5437"
    command: -p 5437
    environment:
      POSTGRES_DB: ims_dev
      POSTGRES_USER: ims_app
      POSTGRES_PASSWORD: ims_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims_app -d ims_dev -p 5437"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ims-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: ims-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./env/.env.development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: ims-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
