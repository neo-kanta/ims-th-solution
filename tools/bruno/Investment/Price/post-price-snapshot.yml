info:
  name: post-price-snapshot
  type: http
  seq: 21

http:
  method: POST
  url: "{{investment-base-url}}/instruments/:instrumentId/prices"
  params:
    - name: instrumentId
      value: "{{investment-instrument-id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "business_date": "{{investment-business-date}}",
        "price": "{{investment-price}}",
        "currency": "{{investment-instrument-currency}}",
        "price_source": "{{investment-price-source}}",
        "provider_ref": "{{investment-provider-ref}}",
        "is_stale": {{investment-is-stale}},
        "stale_reason": "{{investment-stale-reason}}"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || {};

        if (data.id) {
          bru.setEnvVar("investment-price-id", data.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
