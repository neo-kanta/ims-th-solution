info:
  name: list-transactions
  type: http
  seq: 26

http:
  method: GET
  url: "{{investment-base-url}}/portfolios/:portfolioId/transactions?instrument_id&from&to&page&limit"
  params:
    - name: portfolioId
      value: "{{investment-portfolio-id}}"
      type: path
    - name: instrument_id
      value: "{{investment-instrument-id}}"
      type: query
    - name: from
      value: "{{investment-from-date}}"
      type: query
    - name: to
      value: "{{investment-to-date}}"
      type: query
    - name: page
      value: "{{investment-page}}"
      type: query
    - name: limit
      value: "{{investment-limit}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const item = body?.data?.items?.[0] || {};

        if (item.id) {
          bru.setEnvVar("investment-transaction-id", item.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

