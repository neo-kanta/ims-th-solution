basePath: /api/v2
definitions:
  BindRuleRequest:
    properties:
      effective_from:
        description: '"2006-01-02"'
        type: string
      effective_to:
        description: '"2006-01-02" or null'
        type: string
      priority:
        type: integer
      severity:
        description: BLOCK | WARN | REQUIRE_APPROVAL | MONITOR
        type: string
    type: object
  CancelDecisionRequest:
    properties:
      reason:
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  CancelExecutionRequest:
    properties:
      reason:
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  CashBalanceResponse:
    properties:
      balance:
        type: string
      currency:
        type: string
      last_business_date:
        type: string
      version:
        type: integer
    type: object
  CashProjectionResponse:
    properties:
      cash_impact:
        type: string
      currency:
        type: string
      current_balance:
        type: string
      projected_balance:
        type: string
    type: object
  ComplianceBreachPreviewResponse:
    properties:
      breach_id:
        type: string
      message:
        type: string
      overridable:
        type: boolean
      rule_type_id:
        type: string
      severity:
        type: string
      verdict:
        type: string
    type: object
  CompliancePreviewResponse:
    properties:
      breaches:
        items:
          $ref: '#/definitions/ComplianceBreachPreviewResponse'
        type: array
      check_group_id:
        type: string
      rules_evaluated:
        type: integer
      verdict:
        type: string
    type: object
  ComplianceStatus:
    enum:
    - COMPLIANCE_EVALUATED
    - COMPLIANCE_NOT_CONFIGURED
    - COMPLIANCE_UNAVAILABLE
    type: string
    x-enum-varnames:
    - ComplianceStatusEvaluated
    - ComplianceStatusNotConfigured
    - ComplianceStatusUnavailable
  ComplianceVerdict:
    enum:
    - PASS
    - WARN
    - BLOCK
    type: string
    x-enum-varnames:
    - ComplianceVerdictPass
    - ComplianceVerdictWarn
    - ComplianceVerdictBlock
  CreateDecisionV2Request:
    properties:
      amount:
        type: string
      business_date:
        type: string
      currency:
        type: string
      exchange:
        type: string
      instrument_code:
        maxLength: 40
        type: string
      instrument_id:
        type: string
      limit_price:
        type: string
      quantity:
        type: string
      rationale:
        type: string
      research_report_id:
        type: string
      side:
        enum:
        - BUY
        - SELL
        type: string
    required:
    - business_date
    - currency
    - instrument_code
    - side
    type: object
  CreateExecutionV2Request:
    properties:
      broker_reference:
        type: string
      ordered_amount:
        type: string
      ordered_quantity:
        type: string
    type: object
  CreatePortfolioV2Request:
    properties:
      base_currency:
        type: string
      benchmark:
        type: string
      code:
        maxLength: 40
        type: string
      description:
        type: string
      fund_code:
        maxLength: 40
        type: string
      has_units:
        type: boolean
      inception_date:
        type: string
      manager_user_id:
        type: string
      name:
        maxLength: 255
        type: string
      portfolio_type:
        enum:
        - LIVE
        - SIMULATION
        - MODEL
        type: string
      risk_profile:
        type: string
      strategy_code:
        type: string
      style_id:
        type: string
      tax_lot_method:
        type: string
      valuation_currency:
        type: string
    required:
    - base_currency
    - code
    - fund_code
    - inception_date
    - name
    - portfolio_type
    - valuation_currency
    type: object
  DecisionLineResponse:
    properties:
      amount:
        type: string
      currency:
        type: string
      id:
        type: string
      instrument_code:
        type: string
      instrument_id:
        type: string
      limit_price:
        type: string
      line_number:
        type: integer
      notes:
        type: string
      product_type:
        type: string
      quantity:
        type: string
      side:
        type: string
      target_weight:
        type: string
    type: object
  DecisionListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/DecisionResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  DecisionResponse:
    properties:
      amendment_no:
        type: integer
      amount:
        type: string
      approval_request_id:
        type: string
      approval_stage:
