    type: object
  WorkflowStateResponse:
    properties:
      accountingClosedAt:
        type: string
      allowedActions:
        description: |-
          AllowedActions is computed server-side from the current state.
          The UI must use this list to decide which buttons to enable.
        items:
          type: string
        type: array
      blockingReasons:
        description: |-
          BlockingReasons explains why AllowedActions may be empty even though
          a transition appears structurally valid (e.g. previous day still open).
        items:
          $ref: '#/definitions/BlockingReason'
        type: array
      businessDate:
        description: YYYY-MM-DD
        type: string
      contractId:
        type: string
      currentState:
        description: |-
          CurrentState is one of: NOT_STARTED, DAY_OPEN, MANAGER_APPROVED,
          TRANSACTION_CLOSED, ACCOUNTING_CLOSED
        type: string
      managerApprovedAt:
        type: string
      managerApprovedBy:
        type: string
      openedAt:
        description: Per-stage timestamps (null until that stage is reached)
        type: string
      openedBy:
        type: string
      pendingReclose:
        type: boolean
      persisted:
        description: |-
          Persisted is false when no workflow__day_states row exists yet.
          Clients can use this to distinguish a genuinely-started day from
          a cancelled/never-started synthetic NOT_STARTED response.
        type: boolean
      previousDay:
        allOf:
        - $ref: '#/definitions/PreviousDayStatus'
        description: |-
          PreviousDay is populated only when Persisted=false (NOT_STARTED).
          It lets the UI display the previous-day status before the operator
          clicks "Open Day".
      recloseCount:
        type: integer
      transactionClosedAt:
        type: string
      transactionsLocked:
        type: boolean
      version:
        description: |-
          Version is the optimistic lock counter. Clients should pass this
          back in write requests (future: when version field is added to the
          transition request). Nil when Persisted=false.
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: Support Team
  description: Enterprise Investment Management System API with financial-grade security
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://example.com/terms
  title: IMS Thailand API
  version: 1.0.0
paths:
  /admin/audit:
    get:
      description: Query paginated audit events with filters
      parameters:
      - description: Actor UUID
        in: query
        name: actor_id
        type: string
      - description: Event type (e.g., LOGIN_SUCCESS)
        in: query
        name: event_type
        type: string
      - description: Target type (e.g., user, session)
        in: query
        name: target_type
        type: string
      - description: Target ID
        in: query
        name: target_id
        type: string
      - description: Since datetime (ISO 8601)
        in: query
        name: since
        type: string
      - description: Until datetime (ISO 8601)
        in: query
        name: until
        type: string
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Limit (default 50, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuditListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List Audit Events
      tags:
      - Audit
  /admin/audit/export:
    get:
      description: Export audit events matching filter criteria as CSV download
      parameters:
      - description: Actor UUID
        in: query
        name: actor_id
        type: string
      - description: Event type
        in: query
        name: event_type
        type: string
      - description: Since datetime
        in: query
        name: since
        type: string
      - description: Until datetime
        in: query
        name: until
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Export Audit Events as CSV
      tags:
      - Audit
  /admin/sessions/{id}/revoke:
    post:
      description: Admin revoke any session by ID
      parameters:
      - description: Session UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Revoke Any Session (Admin)
      tags:
      - Admin
  /admin/users:
    get:
      description: Paginated user list for admin management with filtering
      parameters:
      - description: Search by username, display name, or email
        in: query
        name: search
        type: string
      - description: Filter by active status (true/false)
        in: query
        name: is_active
        type: string
      - description: Filter by locked status (true/false)
        in: query
        name: is_locked
        type: string
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Limit (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminUserListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List Users
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Administrative creation of a new IAM user
      parameters:
      - description: New User Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create User
      tags:
      - Admin
  /admin/users/{id}/disable:
    post:
      description: Disable a specific user account preventing future logins
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Disable User
      tags:
      - Admin
  /admin/users/{id}/enable:
    post:
      description: Re-enable a disabled user account
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Enable User
      tags:
      - Admin
  /admin/users/{id}/lock:
    post:
      description: Immediately lock a user out of the system
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lock User
      tags:
      - Admin
  /admin/users/{id}/reset-password:
    post:
      consumes:
      - application/json
      description: Forcefully reset a user's password and flag it for mandatory change
        on next login
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: New Password Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/AdminResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Admin Password Reset
      tags:
      - Admin
  /admin/users/{id}/sessions:
    get:
      description: List all active sessions for a specific user (admin only)
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/SessionResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List User Sessions (Admin)
      tags:
      - Admin
  /admin/users/{id}/unlock:
    post:
      description: Unlock an account that was either manually or automatically locked
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Unlock User
      tags:
      - Admin
  /auth/change-password:
