info:
  name: change-password
  type: http
  seq: 6

http:
  method: POST
  url: "{{iam-auth}}/change-password"
  body:
    type: json
    data: |-
      {
        "new_password": "string",
        "old_password": "string"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
