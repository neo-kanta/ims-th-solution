info:
  name: set-user-status
  type: http
  seq: 2

http:
  method: POST
  url: "{{iam-audit}}/users/:target_user_id/:action"
  params:
    - name: action
      value: enable
      type: path
    - name: target_user_id
      value: a0000000-0000-0000-0000-000000000001
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
