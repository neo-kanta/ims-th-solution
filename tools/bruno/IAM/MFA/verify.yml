info:
  name: verify
  type: http
  seq: 2

http:
  method: POST
  url: "{{iam-mfa}}/verify"
  body:
    type: json
    data: |-
      {
        "totp_code": "{{totp_code}}"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 204) {
          bru.setEnvVar("mfa-enrolled", "true", { persist: true });
          bru.setEnvVar("mfa-enabled", "true", { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
