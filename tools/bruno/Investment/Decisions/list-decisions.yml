info:
  name: list-decisions
  type: http
  seq: 1

http:
  method: GET
  url: "{{investment-base-url}}/decisions"
  params:
    - name: page
      value: "{{investment-page}}"
      type: query
    - name: limit
      value: "{{investment-limit}}"
      type: query
    - name: fund_id
      value: "{{investment-fund-id}}"
      type: query
    - name: portfolio_id
      value: "{{investment-portfolio-id}}"
      type: query
    - name: business_date
      value: "{{investment-business-date}}"
      type: query
    - name: status
      value: "{{investment-decision-status}}"
      type: query
    - name: instrument_code
      value: "{{investment-instrument-ticker}}"
      type: query
    - name: search
      value: "{{investment-decision-search}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const payload = body?.data || {};
        const rows = Array.isArray(payload) ? payload : Array.isArray(payload.items) ? payload.items : [];
        const first = rows[0] || {};

        if (first.id) {
          bru.setEnvVar("investment-decision-id", first.id, { persist: true });
        }
        if (first.decision_no) {
          bru.setEnvVar("investment-decision-no", first.decision_no, { persist: true });
        }
        if (first.decision_number) {
          bru.setEnvVar("investment-decision-no", first.decision_number, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
