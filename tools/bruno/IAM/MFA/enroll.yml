info:
  name: enroll
  type: http
  seq: 1

http:
  method: POST
  url: "{{iam-mfa}}/enroll"
  body:
    type: json
    data: |-
      {
        "provisioning_uri": "string",
        "recovery_codes": [
          "string"
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
