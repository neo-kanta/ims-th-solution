info:
  name: mark-read
  type: http
  seq: 2

http:
  method: POST
  url: "{{notification-base-url}}/:id/read"
  params:
    - name: id
      value: "{{notification-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
