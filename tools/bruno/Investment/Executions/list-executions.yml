info:
  name: list-executions
  type: http
  seq: 2

http:
  method: GET
  url: "{{investment-base-url}}/executions?decision_id={{investment-decision-id}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const item = body?.data?.items?.[0] || {};

        if (item.id) {
          bru.setEnvVar("investment-execution-id", item.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
