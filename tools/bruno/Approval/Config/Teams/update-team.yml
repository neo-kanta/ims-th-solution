info:
  name: update-team
  type: http
  seq: 3

http:
  method: PUT
  url: "{{approval-config-base-url}}/teams/:teamId"
  params:
    - name: teamId
      value: "{{approval-team-id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "team_code": "BRUNO-TEAM-001",
        "team_name": "Bruno Approval Team Updated",
        "remarks": "Updated from Bruno approval config coverage sync.",
        "is_active": true,
        "has_co_manager": true,
        "min_required_stamps": 1,
        "max_allowed_stamps": 3
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
