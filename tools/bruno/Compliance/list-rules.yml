info:
  name: list-rules
  type: http
  seq: 1

http:
  method: GET
  url: "{{compliance-base-url}}/rules?rule_type_id&is_active&offset&limit"
  params:
    - name: rule_type_id
      value: "{{compliance-rule-type-id}}"
      type: query
    - name: is_active
      value: "{{compliance-is-active}}"
      type: query
    - name: offset
      value: "{{compliance-offset}}"
      type: query
    - name: limit
      value: "{{compliance-limit}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const instances = body?.data?.instances || [];
        const first = instances[0];
        const typeID = first?.RuleTypeID || first?.rule_type_id || first?.TypeMetadata?.type_id;

        if (typeID) {
          bru.setEnvVar("compliance-rule-type-id", typeID, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
