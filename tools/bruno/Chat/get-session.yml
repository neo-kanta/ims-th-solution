info:
  name: get-session
  type: http
  seq: 3

http:
  method: GET
  url: "{{chat-base-url}}/sessions/:sessionId"
  params:
    - name: sessionId
      value: "{{chat-session-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
