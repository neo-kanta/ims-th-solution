info:
  name: revoke-session
  type: http
  seq: 2

http:
  method: POST
  url: "{{iam-auth}}/sessions/:session_id/revoke"
  params:
    - name: session_id
      value: "{{session_id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
