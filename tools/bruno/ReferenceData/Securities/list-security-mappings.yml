info:
  name: list-security-mappings
  type: http
  seq: 5

http:
  method: GET
  url: "{{reference-data-base-url}}/securities/:securityId/mappings"
  params:
    - name: securityId
      value: "{{reference-data-security-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const rows = Array.isArray(body?.data) ? body.data : [];
        const first = rows[0] || {};

        if (first.id) {
          bru.setEnvVar("reference-data-mapping-id", first.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
