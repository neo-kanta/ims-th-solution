info:
  name: get-decision-details
  type: http
  seq: 4

http:
  method: GET
  url: "{{investment-base-url}}/decisions/:id/details"
  params:
    - name: id
      value: "{{investment-decision-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || {};

        if (data.id) {
          bru.setEnvVar("investment-decision-id", data.id, { persist: true });
        }
        if (data.decision_no) {
          bru.setEnvVar("investment-decision-no", data.decision_no, { persist: true });
        }
        if (data.decision_number) {
          bru.setEnvVar("investment-decision-no", data.decision_number, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
