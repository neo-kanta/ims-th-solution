info:
  name: screen-search
  type: http
  seq: 9

http:
  method: GET
  url: "{{market-data-base-url}}/screen/search?query={{market-data-screen-query}}&limit={{market-data-history-limit}}"
  params:
    - name: query
      value: "{{market-data-screen-query}}"
      type: query
    - name: limit
      value: "{{market-data-history-limit}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
