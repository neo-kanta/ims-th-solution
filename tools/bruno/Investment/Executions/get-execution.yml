info:
  name: get-execution
  type: http
  seq: 3

http:
  method: GET
  url: "{{investment-base-url}}/executions/:executionId"
  params:
    - name: executionId
      value: "{{investment-execution-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
