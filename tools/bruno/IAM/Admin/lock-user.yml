info:
  name: lock-user
  type: http
  seq: 7

http:
  method: POST
  url: "{{iam-admin}}/users/:id/lock"
  params:
    - name: id
      value: "{{user_id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
