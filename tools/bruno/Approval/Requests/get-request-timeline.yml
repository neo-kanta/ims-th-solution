info:
  name: get-request-timeline
  type: http
  seq: 5

http:
  method: GET
  url: "{{approval-base-url}}/requests/:requestId/timeline"
  params:
    - name: requestId
      value: "{{approval-request-id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
