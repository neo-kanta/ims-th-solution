info:
  name: list-session
  type: http
  seq: 6

http:
  method: GET
  url: "{{iam-admin}}/users/:id/sessions"
  params:
    - name: id
      value: "{{user_id}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || [];

        if (data[0]?.id) {
          bru.setEnvVar("session_id", data[0].id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
