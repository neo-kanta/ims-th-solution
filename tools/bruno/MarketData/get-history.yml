info:
  name: get-history
  type: http
  seq: 2

http:
  method: GET
  url: "{{market-data-base-url}}/history?symbol={{market-data-symbol}}&limit={{market-data-history-limit}}"
  params:
    - name: symbol
      value: "{{market-data-symbol}}"
      type: query
    - name: limit
      value: "{{market-data-history-limit}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const first = body?.data?.[0] || {};

        if (first.symbol) {
          bru.setEnvVar("market-data-last-symbol", first.symbol, { persist: true });
        }

        if (first.provider) {
          bru.setEnvVar("market-data-last-provider", first.provider, { persist: true });
        }

        if (first.close) {
          bru.setEnvVar("market-data-last-close", first.close, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
