basePath: /api/v2
definitions:
  ErrorResponse:
    properties:
      code:
        type: string
      details: {}
      error:
        type: string
    type: object
  PortfolioResponse:
    properties:
      base_currency:
        type: string
      benchmark:
        type: string
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      fund_id:
        type: string
      has_units:
        type: boolean
      id:
        type: string
      inception_date:
        type: string
      manager_user_id:
        type: string
      name:
        type: string
      risk_profile:
        type: string
      status:
        type: string
      strategy_code:
        type: string
      style_id:
        type: string
      tax_lot_method:
        type: string
      updated_at:
        type: string
      valuation_currency:
        type: string
      version:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Portfolio V2 endpoints (docs/api/portfolio-v2-api-ddd.md), mounted
    under /api/v2.
  title: IMS Thailand API — Portfolio V2
  version: 2.0.0
paths:
  /portfolios/{portfolioCode}:
    get:
      description: Retrieve one portfolio by its business code (Portfolio V2).
      parameters:
      - description: Portfolio code
        in: path
        name: portfolioCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PortfolioResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Portfolio By Code
      tags:
      - Investment - Portfolios V2
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'JWT Bearer Token. Format: "Bearer <token>"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
