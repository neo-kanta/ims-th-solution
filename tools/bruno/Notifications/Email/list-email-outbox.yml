info:
  name: list-email-outbox
  type: http
  seq: 1

http:
  method: GET
  url: "{{notification-base-url}}/email-outbox"
  params:
    - name: status
      value: "{{notification-email-status}}"
      type: query
    - name: recipient_username
      value: "{{notification-recipient-username}}"
      type: query
    - name: recipient_email
      value: "{{notification-recipient-email}}"
      type: query
    - name: event_type
      value: "{{notification-event-type}}"
      type: query
    - name: event_category
      value: "{{notification-event-category}}"
      type: query
    - name: business_type
      value: "{{notification-business-type}}"
      type: query
    - name: business_reference
      value: "{{notification-business-reference}}"
      type: query
    - name: created_from
      value: "{{notification-created-from}}"
      type: query
    - name: created_to
      value: "{{notification-created-to}}"
      type: query
    - name: limit
      value: "{{notification-limit}}"
      type: query
    - name: offset
      value: "{{notification-offset}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const payload = body?.data || {};
        const rows = Array.isArray(payload) ? payload : Array.isArray(payload.items) ? payload.items : [];
        const first = rows[0] || {};

        if (first.id) {
          bru.setEnvVar("notification-outbox-id", first.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
