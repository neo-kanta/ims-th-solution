info:
  name: list-notifications
  type: http
  seq: 1

http:
  method: GET
  url: "{{notification-base-url}}"
  params:
    - name: unread_only
      value: "{{notification-unread-only}}"
      type: query
    - name: limit
      value: "{{notification-limit}}"
      type: query
    - name: offset
      value: "{{notification-offset}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const payload = body?.data || {};
        const rows = Array.isArray(payload) ? payload : Array.isArray(payload.items) ? payload.items : [];
        const first = rows[0] || {};

        if (first.id) {
          bru.setEnvVar("notification-id", first.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
