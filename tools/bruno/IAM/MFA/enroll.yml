info:
  name: enroll
  type: http
  seq: 1

http:
  method: POST
  url: "{{iam-mfa}}/enroll"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data || {};
        const recoveryCodes = data?.recovery_codes || [];

        if (data.provisioning_uri) {
          bru.setEnvVar("mfa-provisioning-uri", data.provisioning_uri, { persist: true });
        }

        if (recoveryCodes.length > 0) {
          bru.setEnvVar("mfa-recovery-codes-left", String(recoveryCodes.length), { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
