info:
  name: list-breaches
  type: http
  seq: 6

http:
  method: GET
  url: "{{compliance-base-url}}/breaches?portfolio_id&contract_id&status&rule_type_id&date_from&date_to&offset&limit"
  params:
    - name: portfolio_id
      value: "{{compliance-portfolio-id}}"
      type: query
    - name: contract_id
      value: "{{compliance-contract-id}}"
      type: query
    - name: status
      value: "{{compliance-status}}"
      type: query
    - name: rule_type_id
      value: "{{compliance-rule-type-id}}"
      type: query
    - name: date_from
      value: "{{compliance-business-date}}"
      type: query
    - name: date_to
      value: "{{compliance-business-date}}"
      type: query
    - name: offset
      value: "{{compliance-offset}}"
      type: query
    - name: limit
      value: "{{compliance-limit}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const breaches = body?.data?.breaches || [];
        const first = breaches[0];

        if (first?.ID || first?.id) {
          bru.setEnvVar("compliance-breach-id", first.ID || first.id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
